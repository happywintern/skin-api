version: '3.8'

services:
  api:
    build:
      context: ../skin-api
      dockerfile: Dockerfile
    container_name: skin-api
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:stable
    container_name: skin-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
